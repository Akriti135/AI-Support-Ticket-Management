# ===================================================
# AI Ticket Management System - Application Configuration
# ===================================================

# Server Port (Render injects PORT dynamically; defaults to 8080)
server.port=${PORT:8080}

# ===================================================
# Database Configuration (TiDB Cloud MySQL / Local MySQL)
#
# Environment Variables for Render / TiDB Cloud:
#   - DB_HOST (e.g. gateway01.us-east-1.prod.aws.tidbcloud.com)
#   - DB_PORT (e.g. 4000)
#   - DB_NAME (e.g. ai_ticket_db)
#   - DB_USERNAME (e.g. 2xxxxxx.root)
#   - DB_PASSWORD (e.g. your-tidb-password)
#
# TLS Certificate Verification:
#   - Enabled by default for TiDB Cloud via sslMode=VERIFY_IDENTITY
#   - Enabled TLS protocols: TLSv1.2, TLSv1.3
#
# Local Development Fallback:
#   - Defaults to localhost:3306 / ai_ticket_db / root
#   - Set DB_SSL_MODE=DISABLED or DB_USE_SSL=false for local MySQL without SSL
#   - Or use Spring profile: --spring.profiles.active=local
# ===================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_ticket_db}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&useSSL=${DB_USE_SSL:true}&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================
# JWT Configuration
# Environment Variables:
#   - JWT_SECRET
#   - JWT_EXPIRATION (optional)
# ===================================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours in milliseconds
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Local AI (Ollama) Configuration
ollama.api.url=${OLLAMA_URL:http://localhost:11434/api/generate}
ollama.model=${OLLAMA_MODEL:llama3}
ollama.connect-timeout-ms=3000
ollama.read-timeout-ms=5000

# Logging
logging.level.com.aiticket=INFO
logging.level.org.springframework.security=WARN
